[package]
name = "ashiojin_extensions"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true, features = ["3d"] }
gltf = { workspace = true }

my_meshes = { path = "../my_meshes" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bevy = { workspace = true, features = ["debug"] }

# ---
# Workaround : see https://github.com/bevyengine/bevy/issues/10425
[dependencies.blake3]
version = "1.8"
features = ["pure"]
# ---
