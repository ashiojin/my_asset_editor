[package]
name = "previewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["3d"] }
rand = { version ="0.10.1" }
rand_chacha = { version = "0.10.0" }
gltf = { version = "1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

tokio = { version = "1", features = ["full"] }
axum = { version= "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }

# clap = { version = "4.6" }
# indexmap = { version = "2.14" }
# bytemuck = { version = "1.24" }
# nonmax = { version = "0.5" }
# ---
# Workaround : see https://github.com/bevyengine/bevy/issues/10425
[dependencies.blake3]
version = "1.8"
features = ["pure"]
